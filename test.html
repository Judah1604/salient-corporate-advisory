<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Salient Corporate Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F3;
    --ink: #1C1B18;
    --muted: #6B6A63;
    --muted-light: #8A8880;
    --line: #D8D2C4;
    --accent: #9C6B32;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  

  .fine-print {
    margin: 0;
    font-size: 13px;
    color: var(--muted-light);
  }

  .fine-print a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-underline-offset: 4px;
  }

  .fine-print a:hover {
    text-decoration-color: var(--accent);
  }

  @media (max-width: 560px) {
    .row {
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    .heading {
      font-size: 26px;
    }
  }
</style>
</head>
<body>



</body>
</html>
