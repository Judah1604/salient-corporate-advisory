<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Background — Salient Corporate Advisory</title>
<style>
  :root {
    --accent: #9C6B32;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 90vh;
    min-height: 560px;
    background-image: url('PHOTO_URL.jpg'); /* swap in the real hero photo */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .hero__topline {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
  }

  .hero__scrim {
    position: absolute;
    inset: 0;
    background: rgba(20, 22, 26, 0.55);
  }

  /* content (your text/buttons) goes here, positioned however you like */
  .hero__content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 1.5rem;
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero__topline"></div>
  <div class="hero__scrim"></div>
  <div class="hero__content">
    <!-- headline, subtext, buttons go here -->
  </div>
</section>

</body>
</html>
